# teleop_joy.yaml - gamepad driving with teleop_twist_joy. Button and axis numbers are GUESSES for an
# Xbox-style pad; check yours with `ros2 topic echo /joy` and adjust.
joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.1
    autorepeat_rate: 20.0

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 4          # hold LB to drive
    enable_turbo_button: 5    # hold RB for turbo
    axis_linear:
      x: 1                    # left stick up/down
    scale_linear:
      x: 0.2                  # m/s
    scale_linear_turbo:
      x: 0.35
    axis_angular:
      yaw: 3                  # right stick left/right (0 = left stick)
    scale_angular:
      yaw: 1.5                # rad/s
    scale_angular_turbo:
      yaw: 2.5
