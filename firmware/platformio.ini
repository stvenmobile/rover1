; Rover1 firmware - emakefun Maker-ESP32-Pro (ESP32-WROOM-32, 4 MB flash, CH340G USB serial)
;
; One project, one build target ("environment") per program; shared hardware code lives in lib/rover_hw.
;
;   pio run -e motor_test -t upload --upload-port COM3     build + flash the motor test
;   pio device monitor --port COM3                          (115200; type a command letter)
;
; Programs (src/<name>/):
;   motor_test   spin each wheel on command, check encoder directions and counts per turn
;   (llc         the low-level controller for ROS - to come)
;
; Same platform release as piper-watch firmware/face_p4 (pioarduino = Arduino-ESP32 3.x; the official
; PlatformIO platform stops at Arduino-ESP32 2.x, which lacks ledcAttach and the new PCNT driver).
; The first build downloads the platform - several hundred MB, shared by every project.
;
; The Arduino-IDE leftovers beside this file (Rover1_LLC, Calibrate_Encoder, libraries/) are not part of
; this project; they can be archived once the new firmware replaces them.

[platformio]
default_envs = motor_test

[env]
; 55.03.39 = Arduino-ESP32 3.3.9 / ESP-IDF 5.5.4
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:motor_test]
build_src_filter = +<motor_test/>
